    kind: PingEnvironment
    listKind: PingEnvironmentList
    plural: pingenvironments
    singular: pingenvironment
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.tenantId
      name: Tenant
      type: string
    - jsonPath: .spec.tier
      name: Tier
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: PingEnvironment is the Schema for the pingenvironments API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: PingEnvironmentSpec defines the desired state of PingEnvironment.
            properties:
              containerSecurityContext:
                description: |-
                  ContainerSecurityContext sets the container-level securityContext for all product workloads.
                  Per-product container.containerSecurityContext overrides this.
                type: object
                x-kubernetes-preserve-unknown-fields: true
              domain:
                description: |-
                  Domain is the base DNS domain for this environment. Component hostnames are derived
                  from this value when not explicitly set (e.g. pf.<domain>, pf-admin.<domain>).
                type: string
              includeVolumes:
                description: |-
                  IncludeVolumes lists volume names (from spec.volumes) to mount into every product's
                  workload in this environment. Maps to global.includeVolumes in the ping-devops chart.
                items:
                  type: string
                type: array
              ingress:
                description: |-
                  Ingress holds shared ingress settings inherited by all components.
                  Set enabled: true to turn on ingress for all components at once.
                properties:
                  annotations:
                    additionalProperties:
                      type: string
                    description: Annotations are merged into every component's Ingress
                      resource. Per-component annotations take precedence on conflict.
                    type: object
                  className:
                    description: ClassName is the ingressClassName applied to all
                      component ingresses (e.g. nginx, traefik, alb).
                    type: string
                  enabled:
                    description: |-
                      Enabled turns ingress on for all components by default.
                      Each component can still override with its own enabled field.
                    type: boolean
                  tlsSecretRef:
                    description: TLSSecretRef is the default TLS secret name. Per-component
                      tlsSecretRef overrides this.
                    type: string
                type: object
              pingDataConsole:
                description: |-
                  PingDataConsole configures the PingDataConsole web UI.
                  Only deployed when this section is explicitly present and a PingDirectory CR references this environment.
                properties:
                  enabled:
                    description: |-
                      Enabled controls whether PingDataConsole is deployed.
                      Defaults to true when this section is present; set to false to disable.
                    type: boolean
                  image:
                    description: Image is the container image repository. Omit to
                      use the chart's default.
                    type: string
                  ingress:
                    description: |-
                      Ingress configures the Kubernetes Ingress for PingDataConsole.
                      Hostname defaults to pd-console.<spec.domain> when spec.domain is set.
                    properties:
                      annotations:
                        additionalProperties:
                          type: string
                        description: Annotations are merged on top of the global annotations
                          for this component.
                        type: object
                      className:
                        description: ClassName overrides the global ingressClassName
                          for this component.
                        type: string
                      enabled:
                        description: |-
                          Enabled controls whether an Ingress resource is created for this component.
                          When nil the value is inherited from spec.ingress.enabled.
                        type: boolean
                      hostname:
                        description: Hostname is the FQDN for this component. Defaults
                          to <prefix>.<spec.domain> when spec.domain is set.
                        type: string
                      tlsSecretRef:
                        description: TLSSecretRef overrides the global TLS secret
                          name for this component.
                        type: string
                    type: object
                  version:
                    description: Version is the container image tag. Omit to use the
                      chart's default tag.
                    type: string
                type: object
              resources:
                description: |-
                  Resources sets default CPU/memory requests and limits for all product containers.
                  Per-product container.resources overrides this. Both are overridden by tier defaults
                  when neither is set.
                properties:
                  limits:
                    additionalProperties:
                      type: string
                    description: Limits are the maximum resources the container may
                      use.
                    type: object
                  requests:
                    additionalProperties:
                      type: string
                    description: Requests are the minimum resources the container
                      requires.
                    type: object
                type: object
              securityContext:
                description: |-
                  SecurityContext sets the pod-level securityContext for all product workloads.
                  Per-product container.securityContext overrides this.
                type: object
                x-kubernetes-preserve-unknown-fields: true
              targetNamespace:
                description: TargetNamespace is the namespace to deploy into; defaults
                  to metadata.namespace.
                type: string
              tenantId:
                description: TenantID is the PingOne tenant identifier used to name
                  Helm releases.
                type: string
              tier:
                description: 'Tier is one of: development, staging, production.'
                type: string
              vault:
                description: |-
                  Vault configures HashiCorp Vault Agent injection for all products in this environment.
                  Maps to global.vault in the ping-devops Helm chart.
                type: object
                x-kubernetes-preserve-unknown-fields: true
              volumes:
                description: |-
                  Volumes defines named pod-level volumes available to all product workloads in this
                  environment. Each key is the volume name; the value is any valid Kubernetes volume spec
                  (emptyDir, secret, configMap, hostPath, etc.). Products opt in by listing names under
                  container.includeVolumes, or use IncludeVolumes to mount them in every product.
                type: object
                x-kubernetes-preserve-unknown-fields: true
            required:
            - tenantId
            - tier
            type: object
          status:
            description: PingEnvironmentStatus defines the observed state of PingEnvironment.
            properties:
              conditions:
                description: Conditions holds the latest available observations of
                  the resource's state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              observedGeneration:
                description: ObservedGeneration is the generation last processed by
                  the reconciler.
                format: int64
                type: integer
              phase:
                description: 'Phase is the current lifecycle phase: Pending, Deploying,
                  Ready, or Failed.'
                type: string
              release:
                description: Release is the Helm release name managed by this environment.
                type: string
            required:
            - phase
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
