{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "pingone-operator.fullname" . }}-manager-role
  labels:
    {{- include "pingone-operator.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
      - persistentvolumeclaims
      - secrets
      - services
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - ""
    resources:
      - namespaces
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - apps
    resources:
      - deployments
      - statefulsets
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - networking.k8s.io
    resources:
      - ingresses
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - pingone.io
    resources:
      - pingaccesses
      - pingauthorizepaps
      - pingauthorizes
      - pingdirectories
      - pingenvironments
      - pingfederates
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - pingone.io
    resources:
      - pingaccesses/finalizers
      - pingauthorizepaps/finalizers
      - pingauthorizes/finalizers
      - pingdirectories/finalizers
      - pingenvironments/finalizers
      - pingfederates/finalizers
    verbs:
      - update
  - apiGroups:
      - pingone.io
    resources:
      - pingaccesses/status
      - pingauthorizepaps/status
      - pingauthorizes/status
      - pingdirectories/status
      - pingenvironments/status
      - pingfederates/status
    verbs:
      - get
      - patch
      - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "pingone-operator.fullname" . }}-manager-rolebinding
  labels:
    {{- include "pingone-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "pingone-operator.fullname" . }}-manager-role
subjects:
  - kind: ServiceAccount
    name: {{ include "pingone-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "pingone-operator.fullname" . }}-leader-election-role
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pingone-operator.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - create
      - get
      - list
      - update
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "pingone-operator.fullname" . }}-leader-election-rolebinding
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pingone-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "pingone-operator.fullname" . }}-leader-election-role
subjects:
  - kind: ServiceAccount
    name: {{ include "pingone-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
